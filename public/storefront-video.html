<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src 'self'; img-src 'self'"><title>Video del producto</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:#fff;font:14px system-ui,sans-serif}video{display:block;width:100%;height:100%;object-fit:contain;background:#171717;pointer-events:none}p{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;text-align:center;pointer-events:none}video:focus-visible{outline:2px solid white;outline-offset:-3px}</style></head><body><video muted loop playsinline disablepictureinpicture disableremoteplayback tabindex="-1" preload="metadata" aria-label="Video del producto"></video><p role="status">No se pudo reproducir este video.</p><script>
const params=new URLSearchParams(location.search),id=params.get('id'),video=document.querySelector('video'),message=document.querySelector('p');
if(!/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(id||'')){message.style.display='flex';}else{
  video.src='/api/storefront/videos/'+id+'.mp4';video.poster='/api/storefront/videos/'+id+'.jpg';video.muted=true;
  let visible=false;const active=params.get('active')==='1',reduced=matchMedia('(prefers-reduced-motion: reduce)');
  function pause(){video.pause();}
  function sync(){if(!visible||document.hidden){pause();return;}if(active&&!reduced.matches)video.play().catch(()=>{});}
  new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;sync();},{threshold:0.2}).observe(video);
  document.addEventListener('visibilitychange',sync);reduced.addEventListener('change',()=>{if(reduced.matches)pause();else sync();});
  video.addEventListener('pause',()=>{if(visible&&!document.hidden)sync();});
  video.addEventListener('error',()=>message.style.display='flex');
}
</script></body></html>
