services:
  calculadora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculadora-cssbuy
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
